name: supre_app
description: Supre - Gestión de pagos de créditos de motos
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5
  get_it: ^7.6.7
  shared_preferences: ^2.2.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
  fonts:
    - family: Gilroy
      fonts:
        - asset: assets/typography/Gilroy-ExtraBold.otf
          weight: 800
        - asset: assets/typography/Gilroy-Light.otf
          weight: 300
